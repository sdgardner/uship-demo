<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign In — uShip</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css?v=2">
</head>
<body class="auth-page">

<!-- ============ Header (logo only) ============ -->
<header class="site-header">
  <div class="container">
    <a class="logo" href="index.html"><img src="assets/uship-logo.svg" alt="uShip"></a>
  </div>
</header>

<!-- ============ Sign in card ============ -->
<main class="auth-main">
  <div class="auth-card">
    <h1>Sign In</h1>
    <p class="auth-join">Don't have an account? <a href="#">Join uShip</a></p>
    <form onsubmit="return false">
      <label for="email">Email</label>
      <input type="email" id="email" value="partners@uShip.com" autocomplete="username">
      <label for="password">Password</label>
      <div class="pw-wrap">
        <input type="password" id="password" value="asdaf123" autocomplete="current-password">
        <button type="button" class="pw-toggle" id="pw-toggle" aria-label="Show password">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8a8a8a" stroke-width="2"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
      <label class="auth-check"><input type="checkbox"> Keep me signed in</label>
      <a class="btn btn-primary auth-submit" href="#" data-next>Sign in</a>
      <a class="auth-forgot" href="#">Forgot password?</a>
    </form>
  </div>
</main>

<!-- ============ Slim footer ============ -->
<footer class="auth-footer">
  <div class="container">
    <small>Copyright © 2026, uShip Inc. and its licensors. All rights reserved. (Demo prototype)</small>
    <div class="legal-links">
      <a href="#">uShip User Agreement</a>
      <a href="#">Privacy Policy</a>
      <a href="#">Site Map</a>
      <a href="#">Cookie Policy</a>
      <a href="#">Accessibility</a>
      <a href="#">Help</a>
    </div>
  </div>
</footer>

<script src="js/app.js?v=2"></script>
</body>
</html>
